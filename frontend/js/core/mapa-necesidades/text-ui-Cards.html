<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox / Pruebas — Tarjetas y Formulario</title>

    <!-- Hojas de estilos del proyecto -->
    <link rel="stylesheet" href="../../../css/variables.css" />
    <link rel="stylesheet" href="../../../css/style.css" />
    <link rel="stylesheet" href="../../../css/necesidades.css" />

    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
        padding: 20px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .sandbox-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      @media (max-width: 768px) {
        .sandbox-layout {
          grid-template-columns: 1fr;
        }
      }
      .sandbox-section {
        background: rgba(30, 41, 59, 0.5);
        padding: 16px;
        border-radius: 8px;
        border: 1px solid #334155;
      }
      .sandbox-controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .sandbox-btn {
        background: #334155;
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .sandbox-btn:hover {
        background: #475569;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Entorno de Pruebas: Tarjetas y Formulario (E1)</h1>
    <p>Página aislada para validar componentes BEM-lite sin interferir con el mapa.</p>

    <div class="sandbox-layout">
      <!-- COLUMNA IZQUIERDA: Formulario -->
      <div class="sandbox-section">
        <div id="formContainer"></div>
      </div>

      <!-- COLUMNA DERECHA: Listado y Estados UI -->
      <div class="sandbox-section">
        <h3>Vista Previa de Tarjetas y Estados</h3>
        
        <!-- Botones para simular estados visuales (Punto 22 del Manifiesto) -->
        <div class="sandbox-controls">
          <button id="btnStateLoading" class="sandbox-btn">Probar Carga</button>
          <button id="btnStateEmpty" class="sandbox-btn">Probar Vacío</button>
          <button id="btnStateError" class="sandbox-btn">Probar Error</button>
          <button id="btnStateSample" class="sandbox-btn">Cargar Ejemplos</button>
        </div>

        <div id="cardsContainer" class="nexo-cards-container">
          <!-- Aquí se inyectarán las tarjetas o los estados visuales -->
        </div>
      </div>
    </div>

    <!-- Script en ES Module -->
    <script type="module">
      import { initNeedForm, setFormCoordinates, clearNeedForm } from "./formularioNecesidad.js";
      import { 
        createNeedCard, 
        renderLoadingState, 
        renderEmptyState, 
        renderErrorState 
      } from "./necesidadCard.js";

      const formContainer = document.getElementById("formContainer");
      const cardsContainer = document.getElementById("cardsContainer");

      // 1. Inicializar Formulario
      initNeedForm(formContainer, (newNeed) => {
        console.log("Payload enviado desde formulario:", newNeed);
        
        // Asignar ID simulado
        const needWithId = { ...newNeed, id: Date.now().toString() };
        
        // Crear tarjeta DOM
        const cardEl = createNeedCard(needWithId, (id, newStatus) => {
          alert(`Estado de la necesidad #${id} cambiado a: ${newStatus}`);
        });

        // Limpiar contenedor si había un estado de vacío/error e insertar tarjeta arriba
        if (cardsContainer.querySelector(".nexo-state")) {
          cardsContainer.innerHTML = "";
        }
        cardsContainer.prepend(cardEl);
        clearNeedForm();
      });

      // Simular coordenadas seleccionadas (como si hicieras clic en el mapa)
      setFormCoordinates(36.465123, -6.198456);

      // 2. Controladores de los Estados Visuales (Para validar el Punto 22)
      document.getElementById("btnStateLoading").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        cardsContainer.appendChild(renderLoadingState());
      });

      document.getElementById("btnStateEmpty").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        cardsContainer.appendChild(renderEmptyState());
      });

      document.getElementById("btnStateError").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        cardsContainer.appendChild(renderErrorState("Error al conectar con la base de datos de necesidades."));
      });

      document.getElementById("btnStateSample").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        
        const sampleNeeds = [
          {
            id: "1",
            title: "Agua potable y suero",
            description: "Se necesitan al menos 50L de agua embotellada para centro de mando local.",
            type: "alimentos",
            priority: "critica",
            status: "abierta"
          },
          {
            id: "2",
            title: "Mantas y ropa de abrigo",
            description: "Cobijas para albergue temporal en polideportivo.",
            type: "ropa",
            priority: "media",
            status: "abierta"
          }
        ];

        sampleNeeds.forEach(need => {
          const cardEl = createNeedCard(need, (id, status) => console.log(id, status));
          cardsContainer.appendChild(cardEl);
        });
      });

      // Renderizar estado de ejemplo inicial
      document.getElementById("btnStateSample").click();
    </script>
  </body>
</html>
