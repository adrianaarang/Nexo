<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox / Pruebas — Módulo de Necesidades</title>

    <!-- Hojas de estilos globales y de necesidades -->
    <link rel="stylesheet" href="../../../css/variables.css" />
    <link rel="stylesheet" href="../../../css/style.css" />
    <link rel="stylesheet" href="../../../css/necesidades.css" />

    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .sandbox-header {
        margin-bottom: 24px;
        border-bottom: 1px solid #334155;
        padding-bottom: 12px;
      }
      .sandbox-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      @media (max-width: 768px) {
        .sandbox-layout {
          grid-template-columns: 1fr;
        }
      }
      .sandbox-section {
        background: rgba(30, 41, 59, 0.5);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #334155;
      }
      .sandbox-controls {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .sandbox-btn {
        background: #334155;
        color: #fff;
        border: 1px solid #475569;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: background 0.2s ease;
      }
      .sandbox-btn:hover {
        background: #475569;
      }
    </style>
  </head>
  <body>
    <header class="sandbox-header">
      <h1>🧪 Entorno Sandbox: Módulo de Necesidades (E1)</h1>
      <p>Validación aislada de los objetos <code>NeedFormController</code> y <code>NeedCardComponent</code>.</p>
    </header>

    <div class="sandbox-layout">
      <!-- PANEL IZQUIERDO: Formulario de Necesidades -->
      <section class="sandbox-section">
        <div id="formContainer"></div>
      </section>

      <!-- PANEL DERECHO: Tarjetas y Estados Visuales UI -->
      <section class="sandbox-section">
        <h3>Vista Previa de Tarjetas y Estados UI</h3>
        
        <!-- Botones de prueba para validar estados del Punto 22 -->
        <div class="sandbox-controls">
          <button id="btnStateLoading" type="button" class="sandbox-btn">Probar Carga</button>
          <button id="btnStateEmpty" type="button" class="sandbox-btn">Probar Vacío</button>
          <button id="btnStateError" type="button" class="sandbox-btn">Probar Error</button>
          <button id="btnStateSample" type="button" class="sandbox-btn">Cargar Ejemplos</button>
        </div>

        <div id="cardsContainer" class="nexo-cards-container">
          <!-- Aquí se inyectan dinámicamente los nodos DOM de las tarjetas -->
        </div>
      </section>
    </div>

    <!-- Carga del Script como ES Module -->
    <script type="module">
      import { NeedFormController } from "./formularioNecesidad.js";
      import { NeedCardComponent } from "./necesidadCard.js";

      const cardsContainer = document.getElementById("cardsContainer");

      // 1. Instanciar el Controlador del Formulario (Objeto)
      const needForm = new NeedFormController("#formContainer", (newNeedData) => {
        console.log("Payload recibido desde el formulario:", newNeedData);

        // Generar un ID simulado
        const payloadWithId = { ...newNeedData, id: Date.now().toString() };

        // Crear la instancia del componente Tarjeta
        const cardComponent = new NeedCardComponent(payloadWithId, (id, status) => {
          alert(`Cambiar estado de la necesidad #${id} a: ${status}`);
        });

        // Limpiar mensajes de estado de carga/vacío si existen
        if (cardsContainer.querySelector(".nexo-state")) {
          cardsContainer.innerHTML = "";
        }

        // Agregar la tarjeta al inicio del contenedor
        cardsContainer.prepend(cardComponent.getNode());

        // Limpiar el formulario tras la publicación
        needForm.reset();
      });

      // Simular selección de coordenadas desde el mapa (ej: clic en Leaflet)
      needForm.setCoordinates(36.465123, -6.198456);

      // 2. Controladores de los Estados Visuales (Métodos Estáticos)
      document.getElementById("btnStateLoading").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        cardsContainer.appendChild(NeedCardComponent.renderLoading());
      });

      document.getElementById("btnStateEmpty").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        cardsContainer.appendChild(NeedCardComponent.renderEmpty());
      });

      document.getElementById("btnStateError").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        cardsContainer.appendChild(NeedCardComponent.renderError("Error al conectar con el servidor."));
      });

      document.getElementById("btnStateSample").addEventListener("click", () => {
        cardsContainer.innerHTML = "";
        
        const sampleNeeds = [
          {
            id: "101",
            title: "Agua potable y suero fisiológico",
            description: "Se necesitan 100L de agua embotellada para puesto de socorro local.",
            type: "alimentos",
            priority: "critica",
            status: "abierta"
          },
          {
            id: "102",
            title: "Mantas térmicas y abrigo",
            description: "Ropa limpia y cobijas para punto de acogida temporal.",
            type: "ropa",
            priority: "media",
            status: "abierta"
          }
        ];

        sampleNeeds.forEach((need) => {
          const card = new NeedCardComponent(need, (id, status) => {
            console.log(`Estado cambiado: ${id} -> ${status}`);
          });
          cardsContainer.appendChild(card.getNode());
        });
      });

      // Cargar datos de prueba iniciales
      document.getElementById("btnStateSample").click();
    </script>
  </body>
</html>
