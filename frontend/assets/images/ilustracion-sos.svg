    <circle cx="280" cy="210" r="190"/>
    <circle cx="280" cy="210" r="150"/>
  </g>
  <circle cx="280" cy="210" r="110" stroke="#F2542D" stroke-width="1.5" opacity="0.35"/>
  <circle cx="280" cy="210" r="75" stroke="#F2542D" stroke-width="2" opacity="0.6"/>
  <!-- teléfono line art -->
