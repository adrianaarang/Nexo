    <!-- Lógica de mapa y datos -->
    <script src="../js/core/mapa-necesidades/mapaNecesidades.js"></script>

    <!-- Importante: type="module" para permitir imports/exports de JS nativo -->
    <script type="module">
      import { crearTarjetaNecesidad } from "./js/core/mapa-necesidades/necesidadCard.js";
      import { inicializarFormulario } from "./js/core/mapa-necesidades/formularioNecesidad.js";

      const contenedorTarjetas = document.getElementById("contenedor-tarjetas");

      // 1. Inicializar el formulario enviando el callback para añadir la tarjeta al listado
      inicializarFormulario((nuevaNecesidad) => {
        // Generar un ID temporal para la vista previa local
        const necesidadConId = {
          ...nuevaNecesidad,
          id: Date.now().toString(),
          estado: "abierta",
        };

        // Crear el elemento DOM de la tarjeta
        const tarjetaEl = crearTarjetaNecesidad(
          necesidadConId,
          (id, nuevoEstado) => {
            console.log(`Estado de necesidad ${id} cambiado a: ${nuevoEstado}`);
          },
        );

        // Insertar la tarjeta al principio de la lista
        contenedorTarjetas.prepend(tarjetaEl);
      });
    </script>
