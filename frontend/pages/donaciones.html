<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donaciones — Nexo</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <header class="nexo-header">
    <a href="../index.html" class="nexo-header__brand">
      <img src="../assets/logo/nexo-icon.png" alt="Nexo" />
      Nexo
    </a>
    <nav class="nexo-nav">
      <a href="mapa.html">Mapa</a>
      <a href="alertas.html">Alertas</a>
      <a href="voluntariado.html">Voluntariado</a>
      <a href="donaciones.html" class="active">Donaciones</a>
      <a href="personas.html">Personas</a>
      <a href="estoy-bien.html">Estoy bien</a>
    </nav>
  </header>

  <main style="padding: var(--space-lg); max-width: 1100px; margin: 0 auto;">

    <div class="nexo-grid">

      <!-- Lista de donaciones -->
      <section>
        <h2 style="margin-bottom: var(--space-md);">Donaciones activas</h2>

        <div class="controles">
          <label for="filtro-tipo">Filtrar:</label>
          <select id="filtro-tipo">
            <option value="">Todas</option>
            <option value="ofrecida">Ofrecidas</option>
            <option value="solicitada">Solicitadas</option>
          </select>
        </div>

        <p id="estado-lista" hidden></p>
        <div id="lista-donaciones"></div>
      </section>

      <!-- Formulario -->
      <section>
        <h2 style="margin-bottom: var(--space-md);">Publicar donación</h2>

        <form id="form-donacion" class="nexo-form">
          <label for="tipo">Tipo</label>
          <select id="tipo" required>
            <option value="ofrecida">Ofrezco recursos</option>
            <option value="solicitada">Necesito recursos</option>
          </select>

          <label for="recurso">¿Qué recurso?</label>
          <input id="recurso" type="text" placeholder="Ej. Agua, mantas, ropa..." required />

          <label for="cantidad">Cantidad (opcional)</label>
          <input id="cantidad" type="text" placeholder="Ej. 10 litros, 5 cajas..." />

          <label for="contacto">Contacto</label>
          <input id="contacto" type="text" placeholder="Email o teléfono" required />

          <button type="submit" class="nexo-btn">Publicar</button>
        </form>
      </section>

    </div>
  </main>

  <script type="module" src="../js/core/voluntariado-donaciones/donaciones.js"></script>
</body>
</html>
